<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#1a2238"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Subtle grid / neural accent lines in background -->
  <path d="M12 32h40M32 12v40" stroke="#334155" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Glowing Neural Nodes -->
  <circle cx="16" cy="18" r="1.5" fill="#22d3ee" opacity="0.6"/>
  <circle cx="48" cy="18" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="16" cy="46" r="1.5" fill="#06b6d4" opacity="0.4"/>
  <circle cx="48" cy="46" r="1.5" fill="#6366f1" opacity="0.4"/>

  <!-- Javid Signature Glasses / Visor Silhouette Frame -->
  <!-- Left Lens -->
  <rect x="13" y="23" width="16" height="15" rx="4" fill="#090d16" stroke="url(#cyanGlow)" stroke-width="2"/>
  <path d="M15 25h12v7a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-7z" fill="url(#lensGrad)" opacity="0.85"/>
  <!-- Left Lens Reflection Sheen -->
  <path d="M16 26l7 8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M21 26l3 3.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Bridge -->
  <path d="M29 27h6" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Lens -->
  <rect x="35" y="23" width="16" height="15" rx="4" fill="#090d16" stroke="url(#indigoGlow)" stroke-width="2"/>
  <path d="M37 25h12v7a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-7z" fill="url(#lensGrad)" opacity="0.85"/>
  <!-- Right Lens Reflection Sheen -->
  <path d="M38 26l7 8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M43 26l3 3.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Temples / Arms hints -->
  <path d="M9 28h4M51 28h4" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Monogram 'J' Accent subtle crest at bottom -->
  <path d="M30 45h4v3a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2" stroke="url(#cyanGlow)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
